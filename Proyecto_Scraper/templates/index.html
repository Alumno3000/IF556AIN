<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Universal Scraper - AWS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animación y estilos personalizados */
        .card-dynamic-highlight {
            border: 2px solid #22d3ee; /* Cyan brillante */
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.15);
        }
        .loading-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen selection:bg-cyan-500 selection:text-white">
    <div class="container mx-auto max-w-4xl p-6 md:p-12">
        
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-4 tracking-tight">Cloud AI Scraper</h1>
            <p class="text-slate-400 font-light text-lg">Agente de investigación semántica universal en AWS EC2</p>
        </header>

        <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700 mb-8 relative overflow-hidden group">
            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500/10 to-blue-500/10 opacity-0 group-hover:opacity-100 transition duration-500"></div>
            <div class="flex flex-col md:flex-row gap-4 relative z-10">
                <input type="text" id="urlInput" placeholder="Ej: Precios de antibióticos en Perú, Ofertas de Python Junior..."
                       class="flex-1 p-4 rounded-xl bg-slate-900 border border-slate-600 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-900 outline-none transition text-white placeholder-slate-500">
                <button onclick="iniciarScraping()" id="btnAction"
                        class="bg-cyan-600 hover:bg-cyan-500 px-8 py-4 rounded-xl font-bold transition flex justify-center items-center shadow-lg shadow-cyan-900/50 active:scale-95 text-white">
                    <span>Investigar</span>
                </button>
            </div>
        </div>

        <div id="exportArea" class="hidden mb-8 flex justify-end animate-fade-in-up">
            <button onclick="descargarJSON()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-5 py-2.5 rounded-lg flex items-center gap-2 transition shadow-lg hover:-translate-y-0.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                DESCARGAR REPORTE JSON
            </button>
        </div>

        <div id="loading" class="hidden flex flex-col items-center my-12">
            <div class="animate-spin rounded-full h-14 w-14 border-b-2 border-cyan-400 mb-6 border-t-transparent"></div>
            <p class="text-cyan-400 loading-pulse font-mono tracking-wide text-sm">ANALIZANDO FUENTES SEMÁNTICAS...</p>
        </div>

        <div id="resultado" class="hidden bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl mb-16 transform transition-all duration-500">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 mb-6 gap-4">
                <h2 id="res-titulo" class="text-2xl font-bold text-white leading-tight"></h2>
                <span id="res-cat" class="px-3 py-1 bg-cyan-900/50 text-cyan-400 text-xs font-black uppercase tracking-widest rounded-full border border-cyan-700/50"></span>
            </div>
            
            <div class="mb-10">
                <p id="res-resumen" class="text-slate-300 text-lg leading-relaxed font-light"></p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-10" id="res-datos">
                </div>

            <div class="bg-slate-950/50 p-6 rounded-xl border border-slate-800">
                <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 mb-4">Fuentes Verificadas</h3>
                <ul id="res-fuentes" class="space-y-3"></ul>
            </div>
        </div>

        <div class="mt-20">
            <h3 class="text-slate-500 text-[10px] font-black mb-6 uppercase tracking-[0.3em] flex items-center gap-4">
                Auditoría de Búsquedas
                <div class="h-px bg-slate-800 flex-1"></div>
            </h3>
            <div class="overflow-hidden rounded-xl border border-slate-800 bg-slate-800/30 backdrop-blur-sm">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-800/80 text-slate-400 text-[10px] uppercase font-bold tracking-widest">
                        <tr>
                            <th class="p-4 pl-6">Consulta</th>
                            <th class="p-4">Categoría</th>
                            <th class="p-4 text-right pr-6">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="historial-body" class="text-slate-400 divide-y divide-slate-800/50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let ultimoResultado = null;

        async function cargarHistorial() {
            try {
                const res = await fetch('/obtener-historial');
                const historial = await res.json();
                const tbody = document.getElementById('historial-body');
                tbody.innerHTML = ''; 
                historial.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-700/20 transition cursor-default group">
                            <td class="p-4 pl-6 text-slate-300 font-medium group-hover:text-cyan-400 transition-colors">${item.tema}</td>
                            <td class="p-4 text-slate-500 text-xs uppercase font-bold tracking-wide">${item.categoria}</td>
                            <td class="p-4 pr-6 text-right text-emerald-500/80 font-mono text-[10px]">● PERSISTIDO</td>
                        </tr>`;
                });
            } catch (e) { console.error("Error BD:", e); }
        }

        async function iniciarScraping() {
            const query = document.getElementById('urlInput').value;
            const btn = document.getElementById('btnAction');
            if(!query) return alert("Ingresa un tema para investigar");

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultado').classList.add('hidden');
            document.getElementById('exportArea').classList.add('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-50');

            try {
                const response = await fetch('/ejecutar-scraping', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: query})
                });

                const result = await response.json();
                
                if(result.data.error) throw new Error(result.data.error);

                const data = result.data;
                ultimoResultado = data;

                // Renderizar
                document.getElementById('res-titulo').innerText = data.titulo_principal;
                document.getElementById('res-resumen').innerText = data.resumen_ejecutivo;
                document.getElementById('res-cat').innerText = data.categoria;

                // Tarjetas Dinámicas
                const datosContainer = document.getElementById('res-datos');
                datosContainer.innerHTML = '';
                
                data.datos_clave.forEach(item => {
                    const label = item.etiqueta.toUpperCase();
                    // Detectar datos críticos para resaltar
                    const esCritico = label.includes("PRECIO") || label.includes("LINK") || 
                                     label.includes("POSTULAR") || label.includes("REQUISITO") || 
                                     label.includes("SUELDO");
                    
                    const cardClass = esCritico ? "card-dynamic-highlight" : "bg-slate-900 border-slate-700";
                    const labelColor = esCritico ? "text-cyan-400" : "text-slate-500";

                    datosContainer.innerHTML += `
                        <div class="p-5 rounded-xl border ${cardClass} transition-all hover:scale-[1.02] duration-300 shadow-lg">
                            <span class="block text-[10px] ${labelColor} font-black uppercase tracking-widest mb-2">${item.etiqueta}</span>
                            <span class="text-slate-200 text-sm font-medium leading-snug">${item.valor}</span>
                        </div>`;
                });

                // Lista de Fuentes
                const fuentesUl = document.getElementById('res-fuentes');
                fuentesUl.innerHTML = '';
                if(data.fuentes && data.fuentes.length > 0){
                    data.fuentes.forEach((link, idx) => {
                        fuentesUl.innerHTML += `
                            <li class="flex items-start gap-3 text-xs font-mono text-slate-400">
                                <span class="text-cyan-600 select-none">${idx + 1}.</span>
                                <a href="${link}" target="_blank" class="hover:text-cyan-400 transition-colors break-all underline decoration-slate-700 underline-offset-4 decoration-1">${link}</a>
                            </li>`;
                    });
                } else {
                    fuentesUl.innerHTML = '<li class="text-slate-600 italic">Fuentes internas o no disponibles.</li>';
                }

                document.getElementById('resultado').classList.remove('hidden');
                document.getElementById('exportArea').classList.remove('hidden');
                
                // Actualizar historial al finalizar
                await cargarHistorial();

            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        function descargarJSON() {
            if(!ultimoResultado) return;
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(ultimoResultado, null, 4));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `reporte_${Date.now()}.json`);
            document.body.appendChild(dl);
            dl.click();
            dl.remove();
        }

        window.onload = cargarHistorial;
    </script>
</body>
</html>
